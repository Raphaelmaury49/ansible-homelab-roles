---
- name: Sudo (journalise avec log_output)
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/mcp-shell
    mode: "0440"
    validate: visudo -cf %s
  when: mcp_shell_sudo

- name: Retrait du sudo
  ansible.builtin.file:
    path: /etc/sudoers.d/mcp-shell
    state: absent
  when: not mcp_shell_sudo

- name: Dossier applicatif
  ansible.builtin.file:
    path: "{{ mcp_shell_dir }}"
    state: directory
    owner: root
    group: "{{ mcp_shell_user }}"
    mode: "0750"

- name: Venv et dependances figees
  ansible.builtin.pip:
    name: "{{ mcp_shell_pip }}"
    virtualenv: "{{ mcp_shell_dir }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart mcp-shell

- name: Serveur MCP
  ansible.builtin.template:
    src: server.py.j2
    dest: "{{ mcp_shell_dir }}/server.py"
    owner: root
    group: "{{ mcp_shell_user }}"
    mode: "0640"
  notify: Restart mcp-shell

- name: Environnement (cle upstream)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ mcp_shell_dir }}/.env"
    owner: root
    group: "{{ mcp_shell_user }}"
    mode: "0640"
  no_log: true
  notify: Restart mcp-shell

- name: Unit systemd
  ansible.builtin.template:
    src: mcp-shell.service.j2
    dest: /etc/systemd/system/mcp-shell.service
    mode: "0644"
  notify: Restart mcp-shell

- name: Regle nftables (incluse par le role base)
  ansible.builtin.template:
    src: mcp-shell.nft.j2
    dest: /etc/nftables.d/mcp-shell.nft
    mode: "0644"
  notify: Reload nftables

- name: Service actif
  ansible.builtin.systemd_service:
    name: mcp-shell
    enabled: true
    state: started
    daemon_reload: true

- name: Appliquer les handlers avant les tests
  ansible.builtin.meta: flush_handlers

- name: "Test 1 : sans cle -> 401"
  ansible.builtin.uri:
    url: "http://{{ mcp_shell_bind }}:{{ mcp_shell_port }}/mcp"
    method: POST
    body_format: json
    body: {}
    status_code: 401
  register: _t1
  retries: 10
  delay: 3
  until: _t1.status == 401

- name: "Test 2 : avec cle -> initialize"
  ansible.builtin.uri:
    url: "http://{{ mcp_shell_bind }}:{{ mcp_shell_port }}/mcp"
    method: POST
    headers:
      X-MCP-Key: "{{ mcp_shell_upstream_key }}"
      Accept: "application/json, text/event-stream"
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: initialize
      params:
        protocolVersion: "2025-06-18"
        capabilities: {}
        clientInfo: {name: ansible-test, version: "1"}
    status_code: 200
  no_log: true

- name: Informations d'enregistrement pour la gateway
  ansible.builtin.set_fact:
    mcp_registration:
      name: "{{ mcp_shell_name }}"
      host: "{{ mcp_shell_bind }}"
      port: "{{ mcp_shell_port }}"
      key_file: "{{ mcp_shell_key_file }}"
    cacheable: true

- name: Resume
  ansible.builtin.debug:
    msg: "MCP shell pret sur http://{{ mcp_shell_bind }}:{{ mcp_shell_port }}/mcp (cle : {{ mcp_shell_key_file }})"
