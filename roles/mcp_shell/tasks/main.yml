---
- name: Garde-fou
  ansible.builtin.assert:
    that: mcp_shell_allowed_src | length > 0
    fail_msg: "mcp_shell_allowed_src est obligatoire (IP de la gateway MCP)"
    quiet: true

- name: Paquets
  ansible.builtin.apt:
    name: [python3-venv, python3-packaging, sudo]   # packaging : requis par le module pip
    state: present

- name: Utilisateur systeme
  ansible.builtin.user:
    name: "{{ mcp_shell_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ mcp_shell_dir }}"
    create_home: false
  register: _mcp_user

- name: Plan partiel (premier deploiement, le compte systeme n existe pas encore)
  ansible.builtin.debug:
    msg: "check mode : installation de mcp-shell prevue, details disponibles apres le premier apply"
  when: ansible_check_mode and _mcp_user.changed

- name: Installation et tests
  ansible.builtin.include_tasks: install.yml
  when: not (ansible_check_mode and _mcp_user.changed)
