---
- name: Garde-fous anti-lockout
  ansible.builtin.assert:
    that:
      - base_admin_ssh_keys | length > 0
      - (not base_firewall) or (base_ssh_allowed_sources | length > 0)
    fail_msg: "base_admin_ssh_keys et base_ssh_allowed_sources sont obligatoires"
    quiet: true

- name: IP du controleur (toujours autorisee en SSH pour ne pas se couper l'acces)
  ansible.builtin.set_fact:
    _base_ctrl_ip: "{{ (ansible_env.SSH_CLIENT | default('')).split(' ') | first }}"

- name: Paquets
  ansible.builtin.apt:
    name: >-
      {{ base_packages
         + (['qemu-guest-agent'] if ansible_virtualization_type == 'kvm' else [])
         + (['prometheus-node-exporter'] if base_node_exporter else []) }}
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Fuseau horaire (sans timedatectl, compatible LXC non privilegie)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ base_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: /etc/timezone
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ base_timezone }}\n"
    mode: "0644"

- name: Compte admin
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    password: "{{ base_admin_password_hash if base_admin_password_hash else omit }}"
    update_password: always
  register: _base_admin

- name: Cles SSH du compte admin (liste exclusive)
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    key: "{{ base_admin_ssh_keys | join('\n') }}"
    exclusive: true
  # en --check le compte n existe pas encore au premier passage
  when: not (ansible_check_mode and _base_admin.changed)

- name: Sudo sans mot de passe
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ base_admin_user }}"
    content: "{{ base_admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: visudo -cf %s
  when: base_admin_sudo_nopasswd

- name: Retrait du sudo sans mot de passe
  ansible.builtin.file:
    path: "/etc/sudoers.d/90-{{ base_admin_user }}"
    state: absent
  when: not base_admin_sudo_nopasswd

- name: Durcissement sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Mises a jour automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: base_auto_upgrades

- name: Dossier des regles nftables additionnelles (utilise par les autres roles)
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"
  when: base_firewall

- name: Regles nftables
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  notify: Reload nftables
  when: base_firewall

- name: Service nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: "{{ base_firewall }}"
    state: "{{ 'started' if base_firewall else 'stopped' }}"

- name: node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: base_node_exporter
  ignore_errors: "{{ ansible_check_mode }}"  # paquet pas encore installe en --check

- name: Agent QEMU
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: ansible_virtualization_type == 'kvm'
  ignore_errors: "{{ ansible_check_mode }}"  # paquet pas encore installe en --check
