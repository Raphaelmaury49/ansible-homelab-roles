---
# Compte et chemins
malscan_user: malscan
malscan_dir: /opt/malscan                # code + venv
malscan_data: /srv/malscan               # regles, home du service
malscan_name: "{{ inventory_hostname }}"

# Echantillons : on reutilise le depot de ghidra_reva (meme flux rsync/rrsync)
malscan_samples: /srv/reva/samples

# Frontal MCP (cle X-MCP-Key, meme modele que reva)
malscan_bind: "{{ ansible_default_ipv4.address }}"
malscan_port: 8101
malscan_allowed_src: []                  # IP de la gateway MCP (OBLIGATOIRE)

# Moteurs
malscan_pip_core:
  - fastmcp==4.0.3
malscan_capa: true                       # capa en best-effort (capacites + ATT&CK)
malscan_capa_pip: flare-capa
malscan_capa_rules_dir: "{{ malscan_data }}/capa-rules"

# Sources de regles (telechargees ; egress WAN autorise, LAN verrouille par reva.nft)
malscan_yara_url: "https://github.com/YARAHQ/yara-forge/releases/latest/download/yara-forge-rules-core.zip"
malscan_capa_rules_url: "https://github.com/mandiant/capa-rules/archive/refs/heads/master.zip"

# Cle generee une fois sur le controleur (chmod 600)
malscan_upstream_key_file: "{{ playbook_dir }}/../credentials/{{ inventory_hostname }}/malscan_mcp_key"
malscan_upstream_key: "{{ lookup('ansible.builtin.password', malscan_upstream_key_file ~ ' length=48 chars=ascii_letters,digits') }}"
