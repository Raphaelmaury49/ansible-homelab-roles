---
- name: Compte de service (groupe reva = lecture des echantillons ; clamav = socket clamd)
  ansible.builtin.user:
    name: "{{ malscan_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ malscan_data }}/home"
    create_home: true
    groups: [reva, clamav]
    append: true
    password: "!"

- name: Arborescence
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(malscan_user) }}"
    group: "{{ item.group | default(malscan_user) }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - {path: "{{ malscan_dir }}"}
    - {path: "{{ malscan_dir }}/app", owner: root, group: "{{ malscan_user }}"}
    - {path: "{{ malscan_data }}", mode: "0755"}
    - {path: "{{ malscan_data }}/home", mode: "0700"}
    - {path: "{{ malscan_data }}/yara", mode: "0755"}
    - {path: "{{ malscan_capa_rules_dir }}", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Code (aggregateur, serveur MCP, maj des regles)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ malscan_dir }}/app/{{ item.src }}"
    owner: root
    group: "{{ malscan_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: malscan.py, mode: "0755"}
    - {src: malscan_server.py, mode: "0644"}
    - {src: update-rules.sh, mode: "0755"}
  loop_control:
    label: "{{ item.src }}"
  notify: Restart malscan-mcp

- name: CLI 'malscan'
  ansible.builtin.file:
    src: "{{ malscan_dir }}/app/malscan.py"
    dest: /usr/local/bin/malscan
    state: link

- name: Venv (FastMCP)
  ansible.builtin.pip:
    name: "{{ malscan_pip_core }}"
    virtualenv: "{{ malscan_dir }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart malscan-mcp

- name: capa (best-effort)
  ansible.builtin.pip:
    name: "{{ malscan_capa_pip }}"
    virtualenv: "{{ malscan_dir }}/venv"
  when: malscan_capa | bool
  ignore_errors: true

- name: Environnement du service
  ansible.builtin.template:
    src: malscan.env.j2
    dest: "{{ malscan_dir }}/.env"
    owner: root
    group: "{{ malscan_user }}"
    mode: "0640"
  no_log: true
  notify: Restart malscan-mcp

- name: Unit systemd MCP
  ansible.builtin.template:
    src: malscan-mcp.service.j2
    dest: /etc/systemd/system/malscan-mcp.service
    mode: "0644"
  notify: Restart malscan-mcp

- name: Timer de maj des regles
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [malscan-rules.service, malscan-rules.timer]

- name: Regles nftables (input MCP ; egress deja gere par reva.nft)
  ansible.builtin.template:
    src: malscan.nft.j2
    dest: /etc/nftables.d/malscan.nft
    mode: "0644"
  notify: Reload nftables

- name: Premiere recuperation des regles (best-effort)
  ansible.builtin.command: "{{ malscan_dir }}/app/update-rules.sh {{ malscan_data }}/yara"
  environment:
    MALSCAN_YARA_URL: "{{ malscan_yara_url }}"
    MALSCAN_CAPA_RULES_URL: "{{ malscan_capa_rules_url }}"
    MALSCAN_CAPA_RULES_DIR: "{{ malscan_capa_rules_dir }}"
  register: _rules
  changed_when: "'ok' in _rules.stdout"
  failed_when: false
  when: not ansible_check_mode

- name: Services actifs (freshclam, clamd, MCP, timer)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [clamav-freshclam, clamav-daemon, malscan-mcp, malscan-rules.timer]
  when: not ansible_check_mode

- name: Appliquer les handlers avant les tests
  ansible.builtin.meta: flush_handlers

- name: "Test 1 : clamd actif"
  ansible.builtin.systemd_service:
    name: clamav-daemon
    state: started
  when: not ansible_check_mode

- name: "Test 2 : MCP refuse sans cle -> 401"
  ansible.builtin.uri:
    url: "http://{{ malscan_bind }}:{{ malscan_port }}/mcp"
    method: POST
    body_format: json
    body: {}
    status_code: 401
  register: _t2
  retries: 15
  delay: 3
  until: _t2.status == 401
  when: not ansible_check_mode

- name: "Test 3 : MCP avec cle -> initialize"
  ansible.builtin.uri:
    url: "http://{{ malscan_bind }}:{{ malscan_port }}/mcp"
    method: POST
    headers:
      X-MCP-Key: "{{ malscan_upstream_key }}"
      Accept: "application/json, text/event-stream"
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: initialize
      params:
        protocolVersion: "2025-06-18"
        capabilities: {}
        clientInfo: {name: ansible-test, version: "1"}
    status_code: 200
  no_log: true
  when: not ansible_check_mode

- name: Resume
  ansible.builtin.debug:
    msg: "malscan pret : MCP http://{{ malscan_bind }}:{{ malscan_port }}/mcp (cle {{ malscan_upstream_key_file }}) | CLI 'malscan <fichier>' | echantillons {{ malscan_samples }}"
