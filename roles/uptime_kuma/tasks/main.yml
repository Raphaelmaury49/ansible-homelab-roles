---
- name: Garde-fous
  ansible.builtin.assert:
    that:
      - uptime_kuma_http_sources is not string
      - uptime_kuma_http_sources | length > 0
      - "uptime_kuma_version is match('^[12][.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$')"
      - "(uptime_kuma_version.split('.')[0] | int) == 1 or (uptime_kuma_allow_v2 | bool)"
      - uptime_kuma_port | int > 0
      - uptime_kuma_port | int < 65536
      - "uptime_kuma_data_dir is match('^/[^ ]+')"
      - "uptime_kuma_install_dir is match('^/[^ ]+')"
    fail_msg: >-
      uptime_kuma_http_sources (liste non vide de CIDR) est obligatoire ; uptime_kuma_version doit etre
      un tag 1.x ou 2.x (ex. 1.23.17) ; une 2.x exige uptime_kuma_allow_v2: true ; port et repertoires
      doivent etre valides
    quiet: true

- name: Paquets
  ansible.builtin.apt:
    name: "{{ uptime_kuma_packages + uptime_kuma_build_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Version de Node.js
  ansible.builtin.command: "{{ uptime_kuma_node_bin }} --version"
  register: _uk_node
  changed_when: false
  failed_when: false
  check_mode: false

- name: Node.js suffisant
  ansible.builtin.assert:
    that:
      - _uk_node.rc == 0
      - (_uk_node.stdout | default('') | trim | regex_replace('^v', '')) is version(uptime_kuma_node_min, '>=')
    fail_msg: "Node.js >= {{ uptime_kuma_node_min }} requis (trouve : {{ _uk_node.stdout | default('absent') }})"
    quiet: true
  when: not ansible_check_mode

- name: Version majeure de Node.js (le module natif sqlite depend de l ABI)
  ansible.builtin.set_fact:
    _uk_node_major: "{{ _uk_node.stdout | default('') | trim | regex_replace('^v([0-9]+)[.].*$', '\\1') }}"

- name: Groupe systeme
  ansible.builtin.group:
    name: "{{ uptime_kuma_group }}"
    system: true

- name: Utilisateur systeme
  ansible.builtin.user:
    name: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_group }}"
    system: true
    home: "{{ uptime_kuma_data_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Repertoire de donnees
  ansible.builtin.file:
    path: "{{ uptime_kuma_data_dir }}"
    state: directory
    owner: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_group }}"
    mode: "0750"

# Un kuma.db copie en root avant le premier demarrage doit rester lisible par le service
- name: Proprietaire des donnees (recursif, sans toucher aux modes)
  ansible.builtin.file:
    path: "{{ uptime_kuma_data_dir }}"
    state: directory
    recurse: true
    owner: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_group }}"

- name: Unite systemd existante ?
  ansible.builtin.stat:
    path: /etc/systemd/system/uptime-kuma.service
  register: _uk_unit

- name: Code source (tag epingle)
  ansible.builtin.git:
    repo: "{{ uptime_kuma_repo }}"
    dest: "{{ uptime_kuma_install_dir }}"
    version: "{{ uptime_kuma_version }}"
    depth: "{{ uptime_kuma_git_depth if (uptime_kuma_git_depth | int) > 0 else omit }}"
    force: true
  register: _uk_git

- name: node_modules present ?
  ansible.builtin.stat:
    path: "{{ uptime_kuma_install_dir }}/node_modules"
  register: _uk_nm

- name: dist present ?
  ansible.builtin.stat:
    path: "{{ uptime_kuma_install_dir }}/dist/index.html"
  register: _uk_dist

- name: Marqueur de build (version + node)
  ansible.builtin.command: cat "{{ uptime_kuma_install_dir }}/.ansible-build"
  register: _uk_marker
  changed_when: false
  failed_when: false
  check_mode: false

- name: Build necessaire ?
  ansible.builtin.set_fact:
    _uk_marker_want: "{{ uptime_kuma_version }}|node{{ _uk_node_major }}"
    _uk_needs_build: >-
      {{ (uptime_kuma_force_rebuild | bool)
         or _uk_git.changed
         or (not _uk_nm.stat.exists)
         or (not _uk_dist.stat.exists)
         or ((_uk_marker.stdout | default('') | trim) != (uptime_kuma_version ~ '|node' ~ _uk_node_major)) }}

- name: Installation / mise a jour de l application
  when: _uk_needs_build | bool
  block:
    - name: Arret du service avant remplacement du code
      ansible.builtin.systemd_service:
        name: uptime-kuma
        state: stopped
      when: _uk_unit.stat.exists and not ansible_check_mode

    - name: kuma.db present ?
      ansible.builtin.stat:
        path: "{{ uptime_kuma_data_dir }}/kuma.db"
      register: _uk_db

    # Au premier passage avec un kuma.db depose a la main, c est la sauvegarde de la base d origine
    - name: Copie de securite de kuma.db (non ecrasee si elle existe deja)
      ansible.builtin.copy:
        src: "{{ uptime_kuma_data_dir }}/kuma.db"
        dest: "{{ uptime_kuma_data_dir }}/kuma.db.pre-{{ uptime_kuma_version }}"
        remote_src: true
        force: false
        owner: "{{ uptime_kuma_user }}"
        group: "{{ uptime_kuma_group }}"
        mode: "0600"
      when: uptime_kuma_backup_db_on_upgrade and _uk_db.stat.exists

    # equivalent de `npm run setup` (git checkout <tag> && npm ci --production && npm run download-dist)
    - name: Dependances npm (production uniquement)
      ansible.builtin.command: npm ci --omit dev --no-audit --no-fund
      args:
        chdir: "{{ uptime_kuma_install_dir }}"
      environment:
        HOME: /root
        npm_config_update_notifier: "false"
      changed_when: true

    - name: Telechargement du frontend compile (dist.tar.gz de la release)
      ansible.builtin.command: npm run download-dist
      args:
        chdir: "{{ uptime_kuma_install_dir }}"
      environment:
        HOME: /root
        npm_config_update_notifier: "false"
      changed_when: true

    # download-dist.js sort en code 0 meme quand l archive est introuvable
    - name: dist telecharge ?
      ansible.builtin.stat:
        path: "{{ uptime_kuma_install_dir }}/dist/index.html"
      register: _uk_dist_after

    - name: Verification du frontend
      ansible.builtin.assert:
        that: _uk_dist_after.stat.exists or ansible_check_mode
        fail_msg: "dist/index.html absent apres npm run download-dist (archive de release introuvable ?)"
        quiet: true

    - name: Marqueur de build
      ansible.builtin.copy:
        content: "{{ _uk_marker_want }}\n"
        dest: "{{ uptime_kuma_install_dir }}/.ansible-build"
        owner: root
        group: root
        mode: "0644"
      notify: Restart uptime-kuma

- name: Unite systemd
  ansible.builtin.template:
    src: uptime-kuma.service.j2
    dest: /etc/systemd/system/uptime-kuma.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart uptime-kuma

- name: Dossier des regles nftables additionnelles (cree par base, garanti ici)
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Regles nftables
  ansible.builtin.template:
    src: uptime-kuma.nft.j2
    dest: /etc/nftables.d/uptime-kuma.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Appliquer unite et pare-feu avant la suite
  ansible.builtin.meta: flush_handlers

- name: Service active et demarre
  ansible.builtin.systemd_service:
    name: uptime-kuma
    enabled: true
    state: started
    daemon_reload: true

# En 2.x, la migration d agregats peut etre longue et un serveur temporaire ecoute sur le meme port :
# adapter uptime_kuma_healthcheck_retries / _delay (ou desactiver) pour une grosse base.
- name: Controle HTTP (200 ou 302)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ uptime_kuma_port }}/"
    follow_redirects: none
    status_code: [200, 302]
  register: _uk_health
  retries: "{{ uptime_kuma_healthcheck_retries }}"
  delay: "{{ uptime_kuma_healthcheck_delay }}"
  until: _uk_health.status is defined and _uk_health.status in [200, 302]
  when: uptime_kuma_healthcheck and not ansible_check_mode

- name: Resume
  ansible.builtin.debug:
    msg: "Uptime Kuma {{ uptime_kuma_version }} : http://{{ ansible_default_ipv4.address | default(inventory_hostname) }}:{{ uptime_kuma_port }} (donnees : {{ uptime_kuma_data_dir }})"
