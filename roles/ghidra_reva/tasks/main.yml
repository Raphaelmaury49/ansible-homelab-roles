---
- name: Garde-fou
  ansible.builtin.assert:
    that: ghidra_reva_allowed_src | length > 0
    fail_msg: "ghidra_reva_allowed_src est obligatoire (IP de la gateway MCP)"
    quiet: true

- name: Paquets
  ansible.builtin.apt:
    name:
      - "{{ ghidra_reva_java_package }}"
      - python3-venv
      - python3-packaging
      - unzip
      - file
      - rsync
    state: present

- name: Utilisateur du service
  ansible.builtin.user:
    name: "{{ ghidra_reva_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ ghidra_reva_data }}/home"
    create_home: false
  register: _reva_user

- name: Plan partiel (premier deploiement)
  ansible.builtin.debug:
    msg: "check mode : installation de Ghidra {{ ghidra_reva_ghidra_version }} + ReVa {{ ghidra_reva_version }} prevue"
  when: ansible_check_mode and _reva_user.changed

- name: Installation et tests
  ansible.builtin.include_tasks: install.yml
  when: not (ansible_check_mode and _reva_user.changed)
