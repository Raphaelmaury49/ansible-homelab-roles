---
- name: Restart reva
  ansible.builtin.systemd_service:
    name: reva
    state: restarted
    daemon_reload: true

- name: Restart reva-mcp
  ansible.builtin.systemd_service:
    name: reva-mcp
    state: restarted
    daemon_reload: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
