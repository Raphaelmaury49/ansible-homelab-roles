---
# Mot de passe du compte admin du DNS Server (OBLIGATOIRE, a fournir depuis un vault/lookup)
technitium_admin_password: ""
technitium_admin_password_iterations: 200000

technitium_web_port: 5380
technitium_install_url: https://download.technitium.com/dns/install.sh
technitium_install_dir: /opt/technitium/dns

# Pare-feu (fichier /etc/nftables.d/technitium.nft, inclus par le role base)
technitium_dns_sources: []          # CIDR autorisees a interroger le DNS (53/udp+tcp) - OBLIGATOIRE
technitium_web_sources: []          # CIDR autorisees sur la console/API (port web)

# Token API non expirant cree pour l'automatisation, stocke sur le controleur (600)
technitium_api_token_name: automation
technitium_api_token_file: "{{ playbook_dir }}/../credentials/{{ inventory_hostname }}/technitium_api_token"

# Reglages appliques via /api/settings/set (noms de parametres de l'API)
technitium_settings: {}
