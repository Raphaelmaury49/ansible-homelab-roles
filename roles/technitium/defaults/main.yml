---
# Mot de passe du compte admin du DNS Server (OBLIGATOIRE, a fournir depuis un vault/lookup)
technitium_admin_password: ""
technitium_admin_password_iterations: 200000

technitium_web_port: 5380
technitium_install_url: https://download.technitium.com/dns/install.sh
technitium_install_dir: /opt/technitium/dns

# Pare-feu (fichier /etc/nftables.d/technitium.nft, inclus par le role base)
technitium_dns_sources: []          # CIDR autorisees a interroger le DNS (53/udp+tcp) - OBLIGATOIRE
technitium_web_sources: []          # CIDR autorisees sur la console/API (port web)
technitium_dhcp: false               # true = ouvre 67/udp (serveur DHCP ; clients en broadcast depuis 0.0.0.0)

# Token API non expirant cree pour l'automatisation, stocke sur le controleur (600)
technitium_api_token_name: automation
technitium_api_token_file: "{{ playbook_dir }}/../credentials/{{ inventory_hostname }}/technitium_api_token"

# Reglages appliques via /api/settings/set (noms de parametres de l'API)
technitium_settings: {}

# Enregistrements locaux faisant autorite : chaque nom devient sa propre zone primaire
# (le reste du domaine parent continue d etre resolu en recursif). Ex. split-DNS / ZTNA :
#   - {name: app.example.com, type: A, value: 10.0.0.10}
technitium_local_records: []

# SSO OpenID Connect (Technitium >= 15) ; {} = non gere par le role.
# Le secret client n est jamais compare (l API le masque) : technitium_sso_force: true pour le re-pousser.
#   technitium_sso:
#     enabled: true
#     authority: https://idp.example.com/application/o/dns/
#     client_id: abc
#     client_secret_file: "{{ playbook_dir }}/../credentials/dns/sso_client_secret"
#     allow_signup: true
#     allow_signup_only_mapped: true
#     scopes: [openid, profile, email]
#     group_map: [{remote: "IdP Admins", local: Administrators}]
technitium_sso: {}
technitium_sso_force: false
