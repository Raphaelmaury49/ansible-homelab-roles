---
- name: Verifier les noms d'utilisateurs
  ansible.builtin.assert:
    that:
      - item is match('^[a-z_][a-z0-9_-]*$')
    fail_msg: "Nom d'utilisateur invalide pour ssh_keyserver_keys : {{ item }}"
    quiet: true
  loop: "{{ ssh_keyserver_keys.keys() | list }}"

- name: Paquets
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Dossier des cles
  ansible.builtin.file:
    path: "{{ ssh_keyserver_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fichiers <user>.keys
  ansible.builtin.copy:
    dest: "{{ ssh_keyserver_root }}/{{ item.key }}.keys"
    content: "{{ (item.value | default([], true)) | join('\n') }}{{ '\n' if (item.value | default([], true)) | length > 0 else '' }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ssh_keyserver_keys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Site nginx (uniquement /<user>.keys, pas de listing)
  ansible.builtin.template:
    src: nginx-keyserver.conf.j2
    dest: /etc/nginx/sites-available/ssh-keyserver
    mode: "0644"
  notify: Recharger nginx (ssh_keyserver)

- name: Activer le site nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ssh-keyserver
    dest: /etc/nginx/sites-enabled/ssh-keyserver
    state: link
  notify: Recharger nginx (ssh_keyserver)

- name: Retirer le site nginx par defaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: ssh_keyserver_nginx_disable_default
  notify: Recharger nginx (ssh_keyserver)

- name: Dossier des regles nftables additionnelles
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"
  when: ssh_keyserver_firewall and ssh_keyserver_http_sources | length > 0

- name: Regles nftables (port 80 depuis le reverse proxy)
  ansible.builtin.template:
    src: ssh-keyserver.nft.j2
    dest: /etc/nftables.d/ssh-keyserver.nft
    mode: "0644"
  when: ssh_keyserver_firewall and ssh_keyserver_http_sources | length > 0
  notify: Recharger nftables (ssh_keyserver)

- name: Service nginx actif
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
  when: not ansible_check_mode
