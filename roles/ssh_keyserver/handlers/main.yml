---
# Les deux handlers partagent le meme topic : validation d'abord, rechargement ensuite.
# Si la validation echoue, le rechargement n'a pas lieu.
- name: Valider la configuration sshd (ssh_keyserver)
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload ssh (ssh_keyserver)

# Avec ssh.socket, un SIGHUP peut faire echouer sshd : on redemarre le service,
# le socket garde le port et les sessions ouvertes ne sont pas coupees.
- name: Recharger sshd (ssh_keyserver)
  ansible.builtin.systemd_service:
    name: "{{ 'sshd' if ansible_os_family == 'RedHat' else 'ssh' }}"
    state: "{{ 'restarted' if (_ssh_keyserver_ssh_socket.stdout | default('')) == 'active' else 'reloaded' }}"
  listen: Reload ssh (ssh_keyserver)

- name: Recharger nginx (ssh_keyserver)
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Recharger nftables (ssh_keyserver)
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
