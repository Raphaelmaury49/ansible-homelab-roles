---
- name: Redemarrer dnsmasq
  ansible.builtin.systemd_service:
    name: dnsmasq
    state: restarted

- name: Recharger nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Recharger nftables (netboot)
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Regenerer le menu des ISOs
  ansible.builtin.systemd_service:
    name: netboot-menu.service
    state: started
    daemon_reload: true
